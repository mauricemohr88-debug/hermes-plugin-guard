<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Hermes Plugin Guard</title>
  <desc id="desc">A dark social card showing a shield and a static scan report for Hermes Agent plugins.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111c"/>
      <stop offset="0.55" stop-color="#0c1824"/>
      <stop offset="1" stop-color="#07130f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#49e6b1"/>
      <stop offset="1" stop-color="#5bc0ff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000" flood-opacity=".38"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#background)"/>
  <circle cx="1050" cy="48" r="280" fill="#1bd99a" opacity=".07" filter="url(#glow)"/>
  <circle cx="100" cy="680" r="310" fill="#279ce8" opacity=".06" filter="url(#glow)"/>
  <path d="M0 118 H1200 M0 557 H1200" stroke="#9bd8c8" stroke-opacity=".06"/>
  <path d="M188 0 V675 M1012 0 V675" stroke="#9bd8c8" stroke-opacity=".04"/>

  <g transform="translate(76 73)">
    <path d="M48 0 92 16v34c0 33-17 57-44 72C21 107 4 83 4 50V16Z" fill="url(#accent)" opacity=".16"/>
    <path d="M48 10 82 22v28c0 26-12 45-34 59C26 95 14 76 14 50V22Z" fill="none" stroke="url(#accent)" stroke-width="4"/>
    <path d="m31 52 11 11 23-26" fill="none" stroke="#67efbd" stroke-linecap="round" stroke-linejoin="round" stroke-width="6"/>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif">
    <text x="202" y="113" fill="#f2fbf8" font-size="54" font-weight="760" letter-spacing="-1.5">Hermes Plugin Guard</text>
    <text x="202" y="158" fill="#9cb5b0" font-size="23" font-weight="450">Review a Hermes Agent plugin before you enable it.</text>

    <g transform="translate(76 207)" filter="url(#shadow)">
      <rect width="1048" height="372" rx="20" fill="#09131d" stroke="#8db9ad" stroke-opacity=".16"/>
      <path d="M0 58 H1048" stroke="#8db9ad" stroke-opacity=".13"/>
      <circle cx="29" cy="29" r="6" fill="#ff6b6b"/>
      <circle cx="50" cy="29" r="6" fill="#ffd166"/>
      <circle cx="71" cy="29" r="6" fill="#49e6b1"/>
      <text x="94" y="36" fill="#809a96" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">hpg scan ./my-plugin</text>

      <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">
        <text x="30" y="100" fill="#8da6a1">$</text>
        <text x="55" y="100" fill="#e7f7f2">hpg scan ./my-plugin --fail-on high</text>
        <text x="30" y="142" fill="#8da6a1">Scanned 1 plugin, 8 files — 3 findings</text>

        <rect x="29" y="169" width="92" height="27" rx="6" fill="#ff6b6b" opacity=".14"/>
        <text x="41" y="189" fill="#ff8c8c" font-size="15" font-weight="700">CRITICAL</text>
        <text x="141" y="189" fill="#e7f7f2">HPG110  Privileged plugin surface</text>
        <text x="790" y="189" fill="#718884" font-size="15">plugin.py:42</text>

        <rect x="29" y="215" width="70" height="27" rx="6" fill="#ffb454" opacity=".13"/>
        <text x="41" y="235" fill="#ffc071" font-size="15" font-weight="700">HIGH</text>
        <text x="119" y="235" fill="#e7f7f2">HPG103  Direct process execution</text>
        <text x="790" y="235" fill="#718884" font-size="15">plugin.py:58</text>

        <rect x="29" y="261" width="82" height="27" rx="6" fill="#ffd166" opacity=".12"/>
        <text x="41" y="281" fill="#ffdc82" font-size="15" font-weight="700">MEDIUM</text>
        <text x="131" y="281" fill="#e7f7f2">HPG107  Undeclared secret environment access</text>
        <text x="790" y="281" fill="#718884" font-size="15">plugin.py:17</text>

        <text x="30" y="329" fill="#ff8c8c" font-weight="700">Result: FAIL</text>
        <text x="162" y="329" fill="#8da6a1">(finding at or above high)</text>
      </g>
    </g>

    <g transform="translate(76 616)">
      <circle cx="7" cy="-7" r="7" fill="#49e6b1"/>
      <text x="24" y="0" fill="#b9d1cc" font-size="18">Static checks</text>
      <circle cx="180" cy="-7" r="7" fill="#49e6b1"/>
      <text x="197" y="0" fill="#b9d1cc" font-size="18">Zero target execution</text>
      <circle cx="440" cy="-7" r="7" fill="#49e6b1"/>
      <text x="457" y="0" fill="#b9d1cc" font-size="18">JSON + SARIF + GitHub Actions</text>
      <text x="1048" y="0" fill="#73b7a5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" text-anchor="end">MIT · v0.1.4</text>
    </g>
  </g>
</svg>
