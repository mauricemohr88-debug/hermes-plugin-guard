[build-system]
requires = ["setuptools>=77,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-plugin-guard"
version = "0.1.4"
description = "Static, no-execution security checks for Hermes Agent plugins"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Maurice Mohr" },
]
keywords = [
  "hermes-agent",
  "plugins",
  "security",
  "static-analysis",
  "sarif",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "PyYAML>=6.0.2,<7",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
]

[project.scripts]
hermes-plugin-guard = "hermes_plugin_guard.cli:main"
hpg = "hermes_plugin_guard.cli:main"

[project.urls]
Homepage = "https://github.com/mauricemohr88-debug/hermes-plugin-guard"
Issues = "https://github.com/mauricemohr88-debug/hermes-plugin-guard/issues"
Repository = "https://github.com/mauricemohr88-debug/hermes-plugin-guard"
Security = "https://github.com/mauricemohr88-debug/hermes-plugin-guard/security/policy"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
norecursedirs = ["tests/fixtures"]

[tool.coverage.run]
branch = true
source = ["hermes_plugin_guard"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
exclude = ["tests/fixtures"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
